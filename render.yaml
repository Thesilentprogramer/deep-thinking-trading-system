services:
  # Backend API (Python/FastAPI)
  - type: web
    name: api-server
    env: python
    rootDirectory: server
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: POETRY_VERSION
        value: 1.8.3
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GOOGLE_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false

  # NSE Data & Notification Service (Node.js)
  - type: web
    name: nse-server
    env: node
    rootDirectory: nse-server
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: "18.17.0"

  # Frontend (React Static Site)
  - type: web
    name: frontend
    env: static
    rootDirectory: client
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: api-server
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_NSE_PROXY_URL
        fromService:
          type: web
          name: nse-server
          envVarKey: RENDER_EXTERNAL_URL
      - key: NODE_VERSION
        value: "18.17.0"
